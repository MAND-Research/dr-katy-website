<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cooper BT';
    src: url('../fonts/Cooper BT/Cooper BT Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    background: #D6DAC8;
    padding: 140px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .open-quote {
    font-family: 'Cooper BT', Georgia, serif;
    font-size: 140px;
    line-height: 0.6;
    color: rgba(104, 106, 71, 0.25);
    margin-bottom: 24px;
  }

  .quote {
    font-family: 'Cooper BT', Georgia, serif;
    font-size: 40px;
    line-height: 1.5;
    color: #272626;
    margin-bottom: 48px;
  }

  .quote .pull {
    color: #AB5818;
  }

  .line {
    width: 40px;
    height: 1px;
    background: rgba(39, 38, 38, 0.25);
    margin-bottom: 28px;
  }

  .author {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 20px;
    color: rgba(39, 38, 38, 0.5);
    margin-bottom: 6px;
  }

  .context {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 17px;
    color: rgba(39, 38, 38, 0.35);
  }
</style>
</head>
<body>
  <div class="open-quote">"</div>
  <div class="quote">It was exactly what a healthcare visit should be. <span class="pull">Calm, personal, thorough, and holistic.</span> Katy listened carefully, asked pertinent questions, and had insights that made me feel like there was hope.</div>
  <div class="line"></div>
  <div class="author">— Ali E.</div>
  <div class="context">Patient</div>
</body>
</html>
