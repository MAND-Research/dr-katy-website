<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cooper';
    src: url('../fonts/Cooper/Cooper-Regular.woff2') format('woff2');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    background: #FDFAF5;
    padding: 140px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .text {
    font-family: 'Cooper', Georgia, serif;
    font-size: 46px;
    line-height: 1.55;
    color: #272626;
  }

  .text .highlight {
    color: #AB5818;
  }

  .byline {
    margin-top: 64px;
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 19px;
    color: rgba(39, 38, 38, 0.45);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="text">
    Health isn't one thing to fix. It's a lot of systems working together, and right now, some of yours are <span class="highlight">speaking louder</span> than others.
  </div>
  <div class="byline">drkatymorrison.com</div>
</body>
</html>
