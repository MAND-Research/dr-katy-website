<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cooper';
    src: url('../fonts/Cooper/Cooper-Regular.woff2') format('woff2');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    background: #686A47;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 100px 90px;
    position: relative;
  }

  .border-frame {
    position: absolute;
    top: 40px;
    left: 40px;
    right: 40px;
    bottom: 40px;
    border: 1px solid rgba(253, 250, 245, 0.25);
    border-radius: 10px;
  }

  .eyebrow {
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #D6DAC8;
    margin-bottom: 48px;
  }

  .quote {
    font-family: 'Cooper', Georgia, serif;
    font-size: 52px;
    line-height: 1.35;
    color: #FDFAF5;
    text-align: center;
    max-width: 820px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: rgba(253, 250, 245, 0.4);
    margin: 48px 0;
  }

  .attribution {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 20px;
    color: rgba(253, 250, 245, 0.7);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="border-frame"></div>
  <div class="eyebrow">A different kind of care</div>
  <div class="quote">Your body isn't broken. It's been trying to talk to you, and no one has been listening.</div>
  <div class="divider"></div>
  <div class="attribution">Dr. Katy Morrison, ND, LAc</div>
</body>
</html>
