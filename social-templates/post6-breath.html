<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cooper BT';
    src: url('../fonts/Cooper BT/Cooper BT Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    background: #686A47;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .top-space {
    flex: 1;
    display: flex;
    align-items: flex-end;
    padding: 0 110px 48px;
  }

  .small-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.7;
    color: rgba(253, 250, 245, 0.55);
  }

  .main {
    padding: 0 110px;
  }

  .headline {
    font-family: 'Cooper BT', Georgia, serif;
    font-size: 54px;
    line-height: 1.4;
    color: #FDFAF5;
  }

  .bottom-space {
    flex: 1.2;
    display: flex;
    align-items: flex-end;
    padding: 0 110px 80px;
    justify-content: space-between;
  }

  .byline {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 18px;
    color: rgba(253, 250, 245, 0.35);
  }
</style>
</head>
<body>
  <div class="top-space">
    <div class="small-text">You keep being told everything looks fine.<br>But you know something is off.</div>
  </div>
  <div class="main">
    <div class="headline">"Normal labs" with persistent symptoms is a signal, not a dismissal.</div>
  </div>
  <div class="bottom-space">
    <div class="byline">Dr. Katy Morrison, ND, LAc</div>
    <div class="byline">drkatymorrison.com</div>
  </div>
</body>
</html>
