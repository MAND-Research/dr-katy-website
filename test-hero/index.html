<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Katy - Integrative Women's Health</title>
    <style>
        /* ========================================
           FONTS
           ======================================== */

        @font-face {
            font-family: 'Cooper BT';
            src: url('../fonts/Cooper BT/Cooper BT Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Cooper BT';
            src: url('../fonts/Cooper BT/Cooper BT Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'Sofia Pro';
            src: url('../fonts/sofia-pro/Sofia Pro Regular Az.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Sofia Pro';
            src: url('../fonts/sofia-pro/Sofia Pro Medium Az.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'Sofia Pro';
            src: url('../fonts/sofia-pro/Sofia Pro Bold Az.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'Sofia Pro';
            src: url('../fonts/sofia-pro/Sofia Pro Light Az.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
        }

        /* ========================================
           COLOR PALETTE
           ======================================== */
        :root {
            --olive: #686A47;
            --burnt-orange: #AB5818;
            --golden: #BC8B41;
            --cream: #FDFAF5;
            --near-black: #272626;
            --sage: #D6DAC8;
            --muted-teal: #9CAFAA;
        }

        /* ========================================
           RESET & BASE
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Sofia Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--cream);
            color: var(--near-black);
            line-height: 1.6;
        }

        /* ========================================
           NAVIGATION
           ======================================== */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            background-color: var(--cream);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Cooper BT', Georgia, serif;
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            color: var(--near-black);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-family: 'Sofia Pro', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--near-black);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--olive);
        }

        .nav-cta {
            background-color: var(--olive);
            color: var(--cream) !important;
            padding: 0.75rem 1.5rem;
            border-radius: 16px;
            transition: background-color 0.3s ease !important;
        }

        .nav-cta:hover {
            background-color: var(--near-black) !important;
        }

        /* ========================================
           HERO SECTION
           ======================================== */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding-top: 80px; /* Account for fixed nav */
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 4rem 4rem 4rem;
            background-color: var(--cream);
        }

        .hero-eyebrow {
            font-family: 'Sofia Pro', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--olive);
            margin-bottom: 1.5rem;
        }

        .hero-headline {
            font-family: 'Cooper BT', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.1;
            color: var(--near-black);
            margin-bottom: 1.5rem;
            max-width: 500px;
        }

        .hero-subheadline {
            font-family: 'Sofia Pro', sans-serif;
            font-size: 1rem;
            color: var(--near-black);
            opacity: 0.8;
            max-width: 400px;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Sofia Pro', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--near-black);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .hero-cta:hover {
            color: var(--olive);
        }

        .hero-cta::after {
            content: '→';
            transition: transform 0.3s ease;
        }

        .hero-cta:hover::after {
            transform: translateX(4px);
        }

        .hero-image {
            position: relative;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 900px) {
            nav {
                padding: 1rem 2rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .hero {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .hero-content {
                padding: 3rem 2rem;
                order: 1;
            }

            .hero-image {
                order: 0;
                min-height: 50vh;
            }

            .hero-headline {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            .nav-links {
                display: none; /* Would add mobile menu */
            }

            .hero-headline {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="/" class="nav-logo">DR. KATY</a>
        <ul class="nav-links">
            <li><a href="/about">About</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/portal">Patient Portal</a></li>
            <li><a href="/contact" class="nav-cta">Work With Us</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <p class="hero-eyebrow">Integrative Women's Health</p>
            <h1 class="hero-headline">Compassionate, Personalized Healthcare for Your Body, Mind, and Spirit</h1>
            <a href="/about" class="hero-cta">Learn More</a>
        </div>
        <div class="hero-image">
            <img src="../images/midcoast-health-session-I-37.jpg" alt="Midcoast Health Collective welcoming clinic interior">
        </div>
    </section>
</body>
</html>
